name: TurboUFI
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 1.5.3
    TURBO_UFI_BUNDLE_ID: com.turbo.ufi
targets:
  TurboUFI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        excludes: [Info.plist]
    dependencies:
      - target: TurboWiFiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TURBO_UFI_BUNDLE_ID)
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
  TurboWiFiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Widgets
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TURBO_UFI_BUNDLE_ID).TurboWiFiWidget
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
